<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Généalogie familiale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f1f5f9; color: #0f172a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 1.2rem; box-sizing: border-box; }
  .card { width: 100%; max-width: 360px; background: #fff; border: 1px solid #e2e8f0;
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08); padding: 1.8rem 1.6rem 1.5rem; box-sizing: border-box; }
  h1 { margin: 0 0 1.3rem; font: 500 1.7rem/1.15 'Cormorant Garamond', Georgia, serif; }
  label.pw { display: block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: #64748b; margin-bottom: 0.35rem; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 0.65rem 0.75rem; font: 400 1rem 'Inter', sans-serif;
    border: 1px solid #cbd5e1; border-radius: 0; outline: none; }
  input[type=password]:focus { border-color: #5b3fa8; box-shadow: 0 0 0 3px rgba(91, 63, 168, 0.15); }
  .remember { display: flex; align-items: center; gap: 0.5rem; margin: 0.85rem 0 1.1rem; font-size: 0.82rem; color: #334155; }
  button { width: 100%; padding: 0.7rem; border: none; background: #0f172a; color: #fff;
    font: 500 0.9rem 'Inter', sans-serif; letter-spacing: 0.04em; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { min-height: 1.2em; margin-top: 0.7rem; font-size: 0.8rem; color: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="f" autocomplete="off">
    <h1 id="t"></h1>
    <label class="pw" for="pw" id="l"></label>
    <input type="password" id="pw" autofocus>
    <label class="remember"><input type="checkbox" id="rem" checked> <span id="r"></span></label>
    <button type="submit" id="b"></button>
    <div class="err" id="e"></div>
  </form>
</div>
